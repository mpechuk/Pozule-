<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pozule — ponds (mahjong) tests</title>
  <style>
    body { font-family: monospace; background: #111; color: #ddd; padding: 20px; }
    .pass { color: #5dd35d; }
    .fail { color: #ff6b6b; font-weight: bold; }
    h1 { color: #6fd0ec; }
    #summary { margin: 14px 0; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Pozule ponds (mahjong) tests</h1>
  <div id="summary"></div>
  <div id="out"></div>

  <script src="../src/variant.js"></script>
  <script>
    // Force the ponds variant before the deck is built (deck.js reads P.variant
    // at load time; there is no ?variant= param on this test page).
    window.Pozule.variantId = "ponds";
    window.Pozule.variant = window.Pozule.VARIANTS.ponds;
  </script>
  <script src="../src/deck.js"></script>
  <script src="../src/poker.js"></script>
  <script src="../src/rules.js"></script>
  <script>
    var P = window.Pozule;
    var out = document.getElementById("out");
    var passed = 0, failed = 0;

    function log(ok, msg) {
      var d = document.createElement("div");
      d.className = ok ? "pass" : "fail";
      d.textContent = (ok ? "PASS  " : "FAIL  ") + msg;
      out.appendChild(d);
      if (ok) passed++; else failed++;
      if (!ok) console.error("FAIL", msg);
    }
    function eq(actual, expected, msg) { log(actual === expected, msg + "  (got " + actual + ")"); }

    // tile("rank", "suit") -> token. e.g. tile("5","dots"), tile("E","honor").
    var idc = 0;
    function tile(rank, suit) { return P.deck.makeToken("x" + idc++, rank, suit); }
    function evalName(arr) { return P.poker.evaluateLine(arr).hand; }

    // --- Deck composition ---
    var bag = P.deck.makeBag(4); // multiplier ignored for the fixed mahjong set
    eq(bag.length, 144, "full mahjong set = 144 tiles");
    function count(pred) { return bag.filter(pred).length; }
    eq(count(function (t) { return t.suit === "dots"; }), 36, "36 dots");
    eq(count(function (t) { return t.suit === "bam"; }), 36, "36 bamboo");
    eq(count(function (t) { return t.suit === "chr"; }), 36, "36 characters");
    eq(count(function (t) { return t.suit === "honor"; }), 28, "28 honors (winds+dragons)");
    eq(count(function (t) { return t.rank === "Fl"; }), 4, "4 flowers");
    eq(count(function (t) { return t.rank === "Se"; }), 4, "4 seasons");

    // --- Value ladder ---
    eq(P.deck.rankValue("1"), 1, "number 1 -> value 1");
    eq(P.deck.rankValue("9"), 9, "number 9 -> value 9");
    eq(P.deck.rankValue("E"), 10, "East wind -> value 10");
    eq(P.deck.rankValue("N"), 13, "North wind -> value 13");
    eq(P.deck.rankValue("Wh"), 14, "White dragon -> value 14");
    eq(P.deck.rankValue("Rd"), 16, "Red dragon -> value 16");

    // --- Combos via the shared evaluator ---
    eq(evalName([tile("3", "dots"), tile("4", "dots"), tile("5", "dots"),
                 tile("6", "dots"), tile("7", "dots")]), "Straight Flush", "suited run of dots");
    eq(evalName([tile("2", "bam"), tile("4", "bam"), tile("6", "bam"),
                 tile("8", "bam"), tile("9", "bam")]), "Flush", "five bamboo of one suit");
    eq(evalName([tile("4", "dots"), tile("5", "bam"), tile("6", "chr"),
                 tile("7", "dots"), tile("8", "bam")]), "Straight", "run across suits");
    // Honors extend the ladder: a run can cross the number->honor boundary.
    eq(evalName([tile("9", "dots"), tile("E", "honor"), tile("S", "honor"),
                 tile("W", "honor"), tile("N", "honor")]), "Straight", "9 + winds run (mixed suit)");
    // Grand run: E,S,W,N,White dragon are same suit, values 10-14 (tops at 14, has a 10).
    eq(evalName([tile("E", "honor"), tile("S", "honor"), tile("W", "honor"),
                 tile("N", "honor"), tile("Wh", "honor")]), "Royal Flush", "grand run of honors");
    // Five matching tiles (four copies of a number plus a fifth) top the chart.
    eq(evalName([tile("7", "dots"), tile("7", "dots"), tile("7", "dots"),
                 tile("7", "dots"), tile("7", "bam")]), "Five of a Kind", "five sevens");

    // --- Flowers / seasons are matches ---
    eq(evalName([tile("Fl", "bonus"), tile("Fl", "bonus")]), "One Pair", "two flowers pair");
    eq(evalName([tile("Fl", "bonus"), tile("Fl", "bonus"),
                 tile("Fl", "bonus"), tile("Fl", "bonus")]), "Four of a Kind", "four flowers");
    eq(evalName([tile("Se", "bonus"), tile("Se", "bonus"),
                 tile("Se", "bonus")]), "Three of a Kind", "three seasons");
    // A flower and a season do NOT match each other.
    eq(evalName([tile("Fl", "bonus"), tile("Se", "bonus")]), "High Card", "flower + season no match");

    // --- Rainbow draft rule (no shared rank, no shared suit) ---
    log(P.rules.isRainbowSet([tile("3", "dots"), tile("4", "bam"), tile("E", "honor")]),
      "rainbow: distinct ranks+suits ok");
    log(!P.rules.isRainbowSet([tile("3", "dots"), tile("3", "dots")]),
      "rainbow: shared rank+suit rejected");
    log(!P.rules.isRainbowSet([tile("3", "dots"), tile("5", "dots")]),
      "rainbow: shared suit rejected");
    log(!P.rules.isRainbowSet([tile("Fl", "bonus"), tile("Se", "bonus")]),
      "rainbow: flower+season share the bonus suit -> rejected");

    var sum = document.getElementById("summary");
    sum.textContent = passed + " passed, " + failed + " failed";
    sum.className = failed === 0 ? "pass" : "fail";
  </script>
</body>
</html>
