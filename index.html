<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pozule — Azul × Poker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="setup">
      <div class="setup-card" id="setupCard">
        <h1 id="setupTitle">POZULE</h1>
        <p class="tag" id="setupTag"></p>
        <div id="variantSelector">
          <p class="choose">Choose a variant:</p>
          <div class="variant-buttons">
            <button data-variant="classic">Classic</button>
            <button data-variant="ponds">Ponds</button>
          </div>
        </div>
        <p class="how" id="setupHow"></p>
        <p class="choose">Choose number of players:</p>
        <div class="player-buttons">
          <button data-players="1">1</button>
          <button data-players="2">2</button>
          <button data-players="3">3</button>
          <button data-players="4">4</button>
        </div>
        <p class="hint">Hotseat — players share the screen and take turns.</p>
      </div>
    </div>
    <canvas id="board"></canvas>
  </div>

  <script src="src/variant.js"></script>
  <script src="src/deck.js"></script>
  <script src="src/poker.js"></script>
  <script src="src/rules.js"></script>
  <script src="src/player.js"></script>
  <script src="src/game.js"></script>
  <script src="src/render.js"></script>
  <script src="src/input.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
